app = "quantguard"
primary_region = "ams"

[build]

[env]
  PORT = "8000"

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

# Persistent storage for the SQLite database - WITHOUT this, the
# database resets every time the container restarts or redeploys,
# since Fly containers are otherwise ephemeral. Create the volume
# once with: fly volumes create quantguard_data --size 1 --region ams
[mounts]
  source = "quantguard_data"
  destination = "/app/backend/database"
